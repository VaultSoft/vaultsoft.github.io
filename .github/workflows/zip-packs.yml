name: Zip champion SFX packs

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - '!downloads/zips/**'
  workflow_dispatch:

jobs:
  build-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Zip each champion folder
        run: |
          mkdir -p downloads/zips
          for dir in downloads/*/; do
            name=$(basename "$dir")
            if [ "$name" != "zips" ]; then
              rm -f "downloads/zips/${name}.zip"
              (cd "$dir" && zip -r -X "../zips/${name}.zip" .)
              echo "Zipped $name"
            fi
          done

      - name: Commit zip files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate champion zip packs"
          file_pattern: "downloads/zips/*.zip"
