name: Zip champion SFX packs

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
  workflow_dispatch:

concurrency:
  group: zip-packs
  cancel-in-progress: false

jobs:
  build-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build one zip per champion
        run: |
          set -euo pipefail
          slug() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/league of legends//; s/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }
          mkdir -p /tmp/zips
          count=0
          for category in downloads/*/; do
            catname=$(basename "$category")
            [ "$catname" = "zips" ] && continue   # ignore any stray output folder
            cs=$(slug "$catname")
            for champdir in "$category"*/; do
              [ -d "$champdir" ] || continue
              champ=$(basename "$champdir")
              ch=$(slug "$champ")
              asset="/tmp/zips/${cs}-${ch}.zip"
              ( cd "$champdir" && zip -qr -X "$asset" . )
              echo "  ${cs}-${ch}.zip  <-  ${catname}/${champ}"
              count=$((count + 1))
            done
          done
          echo "Built ${count} champion zips, total $(du -sh /tmp/zips | cut -f1)"
          ls -lhS /tmp/zips | head -20 || true

      - name: Publish zips to the sound-packs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sound-packs"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "League of Legends Sound Packs" \
              --notes "Per-champion sound & voice packs, generated automatically from the downloads/ folder. Each asset is one champion's pack."
          gh release upload "$tag" /tmp/zips/*.zip --clobber
          echo "Uploaded $(find /tmp/zips -name '*.zip' | wc -l) assets to release '${tag}'"
