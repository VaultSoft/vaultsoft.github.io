name: Zip champion SFX packs

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - '!downloads/zips/**'
  workflow_dispatch:

jobs:
  build-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Zip each champion folder
        run: |
          mkdir -p downloads/zips
          for category in downloads/*/; do
            catname=$(basename "$category")
            if [ "$catname" != "zips" ]; then
              for champdir in "$category"*/; do
                if [ -d "$champdir" ]; then
                  champname=$(basename "$champdir")
                  mkdir -p "downloads/zips/${catname}"
                  rm -f "downloads/zips/${catname}/${champname}.zip"
                  (cd "$champdir" && zip -r -X "../../zips/${catname}/${champname}.zip" .)
                  echo "Zipped ${catname}/${champname}"
                fi
              done
            fi
          done

      - name: Commit zip files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate champion zip packs"
          file_pattern: "downloads/zips/*.zip"
